version: "3.1"

stories:

# ─────────────────────────────
# 대화 시작
- story: 대화 시작
  steps:
    - intent: start_chat
    - action: utter_start_chat

# ─────────────────────────────
# 대화 종료 (end_chat)
- story: 대화 종료 - 긍정
  steps:
    - intent: end_chat
    - slot_was_set:
        - class: positive
    - action: utter_end_chat_positive

- story: 대화 종료 - 중립
  steps:
    - intent: end_chat
    - slot_was_set:
        - class: neutral
    - action: utter_end_chat_neutral

- story: 대화 종료 - 부정
  steps:
    - intent: end_chat
    - slot_was_set:
        - class: negative
    - action: utter_end_chat_negative
    - action: utter_recommend_counseling

# ─────────────────────────────
# 대화 연장
- story: 대화 연장
  steps:
    - intent: continue_chat
    - action: utter_continue_prompt

# ─────────────────────────────
# 일상 (daily) 클래스에 따른 반응
- story: 일상 - 긍정
  steps:
    - intent: daily
    - slot_was_set:
        - class: positive
    - action: utter_daily_positive  # 피드백 제공하고
    - action: utter_ask_continue    # 대화 연장 묻기

- story: 일상 - 중립
  steps:
    - intent: daily
    - slot_was_set:
        - class: neutral
    - action: utter_daily_neutral
    - action: utter_ask_continue

- story: 일상 - 부정
  steps:
    - intent: daily
    - slot_was_set:
        - class: negative
    - action: utter_daily_negative
    - action: utter_ask_continue

# ─────────────────────────────
# 회사 (work)
- story: 회사 - 긍정
  steps:
    - intent: work
    - slot_was_set:
        - class: positive
    - action: utter_work_positive
    - action: utter_ask_continue

- story: 회사 - 중립
  steps:
    - intent: work
    - slot_was_set:
        - class: neutral
    - action: utter_work_neutral
    - action: utter_ask_continue

- story: 회사 - 부정
  steps:
    - intent: work
    - slot_was_set:
        - class: negative
    - action: utter_work_negative
    - action: utter_ask_continue

# ─────────────────────────────
# 학교 (school)
- story: 학교 - 긍정
  steps:
    - intent: school
    - slot_was_set:
        - class: positive
    - action: utter_school_positive
    - action: utter_ask_continue

- story: 학교 - 중립
  steps:
    - intent: school
    - slot_was_set:
        - class: neutral
    - action: utter_school_neutral
    - action: utter_ask_continue

- story: 학교 - 부정
  steps:
    - intent: school
    - slot_was_set:
        - class: negative
    - action: utter_school_negative
    - action: utter_ask_continue

# ─────────────────────────────
# 가족 (family)
- story: 가족 - 긍정
  steps:
    - intent: family
    - slot_was_set:
        - class: positive
    - action: utter_family_positive
    - action: utter_ask_continue

- story: 가족 - 중립
  steps:
    - intent: family
    - slot_was_set:
        - class: neutral
    - action: utter_family_neutral
    - action: utter_ask_continue

- story: 가족 - 부정
  steps:
    - intent: family
    - slot_was_set:
        - class: negative
    - action: utter_family_negative
    - action: utter_ask_continue

# ─────────────────────────────
# 친구 (friend)
- story: 친구 - 긍정
  steps:
    - intent: friend
    - slot_was_set:
        - class: positive
    - action: utter_friend_positive
    - action: utter_ask_continue

- story: 친구 - 중립
  steps:
    - intent: friend
    - slot_was_set:
        - class: neutral
    - action: utter_friend_neutral
    - action: utter_ask_continue

- story: 친구 - 부정
  steps:
    - intent: friend
    - slot_was_set:
        - class: negative
    - action: utter_friend_negative
    - action: utter_ask_continue


# =====================================================================
# 👇 여기부터 멀티턴 경로 보강 (기존 액션 그대로 활용)
# =====================================================================

# 1) 시작 → 일상(부정) → 계속 대화 → 회사(부정) → 다시 계속/종료
- story: 대화 흐름 - 일상에서 회사로 이어짐
  steps:
    - intent: start_chat
    - action: utter_start_chat
    - intent: daily
    - slot_was_set:
        - class: negative
    - action: utter_daily_negative
    - action: utter_ask_continue
    - intent: continue_chat
    - action: utter_continue_prompt
    - intent: work
    - slot_was_set:
        - class: negative
    - action: utter_work_negative
    - action: utter_ask_continue
    - intent: end_chat
    - slot_was_set:
        - class: neutral
    - action: utter_end_chat_neutral

# 2) 시작 → 학교(부정) → 계속 대화 → 친구(부정) → 부정 종료 + 상담 권유
- story: 대화 흐름 - 학교에서 친구 고민으로
  steps:
    - intent: start_chat
    - action: utter_start_chat
    - intent: school
    - slot_was_set:
        - class: negative
    - action: utter_school_negative
    - action: utter_ask_continue
    - intent: continue_chat
    - action: utter_continue_prompt
    - intent: friend
    - slot_was_set:
        - class: negative
    - action: utter_friend_negative
    - action: utter_ask_continue
    - intent: end_chat
    - slot_was_set:
        - class: negative
    - action: utter_end_chat_negative
    - action: utter_recommend_counseling

# 3) 시작 없이 바로 일상 → 긍정 → 계속 대화 → 가족(중립) → 종료
- story: 대화 흐름 - 인사 없이 일상으로 시작
  steps:
    - intent: daily
    - slot_was_set:
        - class: positive
    - action: utter_daily_positive
    - action: utter_ask_continue
    - intent: continue_chat
    - action: utter_continue_prompt
    - intent: family
    - slot_was_set:
        - class: neutral
    - action: utter_family_neutral
    - action: utter_ask_continue
    - intent: end_chat
    - slot_was_set:
        - class: positive
    - action: utter_end_chat_positive

# 4) 시작 → 회사(중립) → "계속 안 할래" 바로 종료
- story: 대화 흐름 - 회사 이야기 후 바로 종료
  steps:
    - intent: start_chat
    - action: utter_start_chat
    - intent: work
    - slot_was_set:
        - class: neutral
    - action: utter_work_neutral
    - action: utter_ask_continue
    - intent: end_chat
    - slot_was_set:
        - class: neutral
    - action: utter_end_chat_neutral

# 5) 시작 → 친구(긍정) → 계속 대화 → 일상(중립) → 계속 대화만 반복
- story: 대화 흐름 - 친구 고민 후 일상 이야기로
  steps:
    - intent: start_chat
    - action: utter_start_chat
    - intent: friend
    - slot_was_set:
        - class: positive
    - action: utter_friend_positive
    - action: utter_ask_continue
    - intent: continue_chat
    - action: utter_continue_prompt
    - intent: daily
    - slot_was_set:
        - class: neutral
    - action: utter_daily_neutral
    - action: utter_ask_continue
    - intent: continue_chat
    - action: utter_continue_prompt
