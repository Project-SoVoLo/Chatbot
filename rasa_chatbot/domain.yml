version: "3.1"

intents:
  - start_chat
  - end_chat        # 사용자가 대화 종료를 요청
  - continue_chat   # 사용자가 대화 연장을 요청
  - daily
  - work
  - school
  - family
  - friend

entities:
  - class

slots:
  class:
    type: categorical
    values:
      - positive
      - neutral
      - negative
    influence_conversation: true
    mappings:
      - type: custom

responses:

  ## 대화 시작 ------------------------------
  utter_start_chat:
    - text: 오늘은 무슨 일이 있었나요? 오늘의 기분은 어때요?
    - text: 안녕하세요! 오늘 하루는 어땠나요?
    - text: 안녕~ 오늘 있었던 일을 들려줄 수 있나요?
    - text: 반가워요 :) 오늘 하루는 어떤 느낌이었나요?
    - text: 와줘서 고마워요. 오늘 있었던 일들, 편하게 얘기해줄래요?
    - text: 안녕, 지금 이 순간 당신 마음은 어떤지 궁금해요.
    - text: 오늘 하루를 한 줄로 표현한다면 뭐라고 말하고 싶어요?

  ## 대화 종료 시 클래스 별 답장 ------------------------------
  utter_end_chat_positive:
    - text: 오늘도 기분이 좋아서 다행이에요. 내일도 좋은 하루 보내요! (end positive)
    - text: 오늘 하루 잘 버텼네요. 이 기분 그대로 내일도 이어지면 좋겠어요 😊
    - text: 좋은 기분으로 마무리해서 정말 다행이에요. 편안한 밤 보내세요.
    - text: 오늘 이야기 나눠줘서 고마워요. 내일도 지금처럼 웃을 수 있기를 바랄게요.
    - text: 밝은 마음으로 오늘을 마무리하는 게 느껴져요. 그 마음, 스스로도 칭찬해줘요!

  utter_end_chat_neutral:
    - text: 오늘도 수고했어요. 내일은 더 행복한 날이길! (end neutral)
    - text: 별일 없는 하루 같아도, 버텨낸 것만으로 충분히 잘한 거예요.
    - text: 오늘도 하루를 무사히 지나온 당신, 그걸로도 의미 있는 하루예요.
    - text: 특별한 일 없어도 괜찮아요. 그런 날들도 쌓여서 당신의 일상이 되니까요.
    - text: 오늘 이만 정리해볼까요? 남은 시간은 조금이라도 편하게 쉬었으면 좋겠어요.

  utter_end_chat_negative:
    - text: 오늘을 버틴 당신이 대견해요. 너무 힘들 땐 전문가와 상담해보는 것도 좋아요! (end negative)
    - text: 많이 힘든 하루였던 것 같아요. 오늘 여기까지 온 것만으로도 정말 큰일 해낸 거예요.
    - text: 마음이 많이 지쳐 보여요. 그래도 이렇게 이야기해준 것 자체가 큰 용기예요.
    - text: 오늘은 스스로를 좀 더 다정하게 대해줬으면 해요. 당신 잘 버티고 있어요.
    - text: 여전히 힘들겠지만, 혼자가 아니라는 것만은 꼭 기억해줬으면 좋겠어요.

  ## 일상 (daily)------------------------------
  utter_daily_positive:
    - text: 요즘은 그래도 조금 나아진 것 같아요 😊 작은 일이라도 해냈다면 정말 잘한 거예요! (+)
    - text: 일상 속에서도 나름대로 잘 버티고 있는 게 느껴져요. 스스로를 칭찬해줘도 좋아요.
    - text: 사소해 보여도 당신에게 의미 있는 순간들이 분명 있었을 거예요. 그게 참 소중해요.
    - text: 요즘 흐름이 나쁘지만은 않은 것 같아요. 그 리듬을 조금씩 더 지켜가보면 좋겠어요.
    - text: 일상 속에서 작은 기쁨을 느끼고 있는 것 같아서 나도 같이 기분이 좋아져요. (+)

  utter_daily_neutral:
    - text: 아무것도 하기 싫은 그런 날, 누구에게나 있어요. 천천히, 마음 가는 대로 지내봐요. (0)
    - text: 특별히 좋지도, 나쁘지도 않은 하루 같네요. 그런 날도 그냥 ‘그랬구나’ 하고 흘려보내도 괜찮아요.
    - text: 애매한 하루였을지라도, 여기서 이렇게 돌아보는 것만으로도 의미가 있어요.
    - text: 요즘 좀 밋밋한 느낌일 수 있어요. 그래도 그 안에 당신만의 속도가 있을 거예요.
    - text: 큰 변화는 없어도, 오늘을 무사히 통과했다는 것만으로도 충분히 잘한 거예요. (0)

  utter_daily_negative:
    - text: 하루종일 누워 있고 싶은 마음… 많이 힘든 거죠. 잠깐 산책이라도 해볼 수 있을까요? (-)
    - text: 아무것도 하기 싫은 날이 계속되면 정말 지치죠. 그런 마음, 충분히 이해돼요.
    - text: 몸도 마음도 퍼져 있는 느낌이겠어요. 그래도 이렇게 와 준 것만으로도 큰 용기예요.
    - text: 요즘 많이 소진된 것 같아요. 잠깐이라도 자신을 위한 휴식 시간을 허락해줄 수 있을까요?
    - text: 하루가 너무 무겁게 느껴졌을 것 같아요. ‘그래도 버텼다’는 말, 오늘만큼은 스스로에게 해줘요. (-)

  ## 회사 (work) ------------------------------
  utter_work_positive:
    - text: 직장에서 조금 여유가 생겼나요? 그런 변화는 당신을 위한 좋은 신호예요! (+)
    - text: 일하면서도 숨 좀 쉴 틈이 생긴 것 같아서 다행이에요. 그 흐름을 계속 가져가면 좋겠어요.
    - text: 회사에서 작은 성취라도 있었다면, 그건 정말 대단한 거예요. 스스로 인정해줘도 좋아요!
    - text: 직장 생활 안에서도 나름 잘 버티고 있는 게 느껴져요. 그 점을 꼭 기억해줬으면 해요.
    - text: 업무 속에서도 당신 페이스를 조금씩 찾아가고 있는 것 같아서 나도 안심돼요. (+)

  utter_work_neutral:
    - text: 일이 많을 땐 누구나 지칠 수 있어요. 작은 휴식이라도 꼭 챙겨보세요. (0)
    - text: 회사 생활이 늘 비슷하게 느껴질 수 있어요. 그래도 그 속에서 버티고 있는 자신을 봐주세요.
    - text: 크게 나쁘진 않지만, 썩 기쁘지도 않은 상태일 수도 있겠네요. 그런 감정도 자연스러워요.
    - text: 업무가 그냥저냥 흘러가는 느낌일 수 있어요. 그 안에서도 나를 지키는 게 중요해요.
    - text: 특별히 좋은 일은 없었더라도, 오늘 하루 잘 버틴 것만으로도 충분히 잘한 거예요. (0)

  utter_work_negative:
    - text: 회사 일로 많이 힘들었겠어요. 부장 대머리 되라 한마디 하고, 오늘은 푹 쉬어요! (-)
    - text: 직장 때문에 마음이 쥐어짜이는 느낌이었을 것 같아요. 그 스트레스, 혼자만의 탓이 아니에요.
    - text: 회사에서 받은 압박이 꽤 컸던 것 같아요. 오늘만큼은 일을 잠시 내려놓고 쉬어도 괜찮아요.
    - text: 출근 생각만 해도 숨이 턱 막힐 때가 있죠. 그 감정, 여기서는 마음껏 토해도 괜찮아요.
    - text: ‘회사 때문에 다 그만두고 싶다’는 생각이 들어도 이상한 거 아니에요. 그만큼 힘들었다는 뜻이니까요. (-)

  ## 학교 (school) ------------------------------
  utter_school_positive:
    - text: 학업 속에서도 잘 해내고 있네요! 대단해요 😊 (+)
    - text: 공부도, 학교 생활도 나름대로 잘 버티고 있는 게 느껴져요. 스스로를 자랑스러워해도 좋아요.
    - text: 학교 일 속에서도 분명 잘하고 있는 부분이 있어요. 그걸 놓치지 않았으면 좋겠어요.
    - text: 학업이 쉽지 않은데도 여기까지 온 것만으로도 정말 잘하고 있는 거예요. (+)
    - text: 요즘 학교 쪽에서 작은 변화나 성취가 있었다면, 그건 분명 의미 있는 걸음이에요.

  utter_school_neutral:
    - text: 학교 생활이 쉽지 않죠. 그래도 천천히 하나씩 해보면 괜찮아질 거예요. (0)
    - text: 수업과 과제가 반복되면 무기력해질 수 있어요. 그런 감정도 자연스러운 과정이에요.
    - text: 학교가 ‘그냥 그런 곳’처럼 느껴질 때도 있어요. 그래도 그 안에서 버티는 자신을 봐주세요.
    - text: 지금 상태가 특별히 좋지도, 나쁘지도 않을 수 있어요. 그 정도로 버티고 있는 것 자체가 이미 충분해요.
    - text: 학교 이야기를 꺼낸 것만으로도, 당신에게 중요한 부분이라는 게 느껴져요. (0)

  utter_school_negative:
    - text: 학교에서 받은 스트레스가 컸겠어요… 그 마음 충분히 이해해요. (-)
    - text: 시험이랑 과제, 사람들까지… 여러 가지가 한꺼번에 힘들게 했을 것 같아요.
    - text: ‘학교 가기 싫다’는 마음이 드는 건, 그만큼 지쳐 있다는 신호일 수도 있어요.
    - text: 학점, 비교, 눈치… 이런 것들 때문에 숨 막힐 때가 있죠. 그 마음 여기에선 편하게 풀어도 돼요.
    - text: 학교에서의 하루가 너무 버겁게 느껴졌을 것 같아요. 오늘은 잠시 내려놓고 쉬어도 괜찮아요. (-)

  ## 가족 (family) ------------------------------
  utter_family_positive:
    - text: 가족과 조금이라도 따뜻한 시간이 있었다면 그건 정말 소중한 일이에요 💛 (+)
    - text: 가족과의 관계에서 작은 온기가 느껴지는 것 같아 나도 같이 안심돼요.
    - text: 완벽하진 않아도, 따뜻한 순간들이 있었다는 게 정말 다행이에요.
    - text: 가족과 웃을 수 있는 시간이 있었다니, 그 순간이 당신에게 오래 남았으면 좋겠어요. (+)
    - text: 집에서 그런 순간들을 느낄 수 있다는 건 분명 큰 힘이 될 거예요.

  utter_family_neutral:
    - text: 집안 분위기가 애매할 땐 나부터 숨 한번 고르는 것도 방법이에요. (0)
    - text: 가족과의 관계가 딱 좋지도, 나쁘지도 않을 때 참 애매하죠. 그런 감정도 솔직한 상태예요.
    - text: 집이 편안하지만은 않을 수 있어요. 그래도 그 안에서 나를 지키는 방법을 같이 고민해보면 좋겠어요.
    - text: 가족과의 거리가 애매하게 느껴질 때, 잠시 한 발짝 물러나 보는 것도 괜찮아요.
    - text: 특별히 좋지도, 나쁘지도 않은 가족 관계일 수 있지만, 그 안에서도 당신 감정은 충분히 중요해요. (0)

  utter_family_negative:
    - text: 가족 문제로 마음이 지쳐 있겠네요. 당신 탓이 아니에요, 절대요. (-)
    - text: 집이 편해야 하는데 오히려 힘들게 느껴질 때가 있죠. 그 마음 정말 이해돼요.
    - text: 가족과의 갈등은 다른 어느 것보다 깊게 남아요. 그 무게를 혼자만 지고 있지 않았으면 좋겠어요.
    - text: 집에 있어도 편하지 않다는 말, 정말 많이 지쳐 있다는 뜻 같아요.
    - text: 가족이 상처를 줄 때, 그 아픔은 오래 남아요. 그 감정을 여기서만큼은 마음껏 말해도 돼요. (-)

  ## 친구 (friend) ------------------------------
  utter_friend_positive:
    - text: 친구와의 관계에 웃음이 생겼다면 그건 정말 반가운 일이에요 😊 (+)
    - text: 편하게 이야기할 수 있는 친구가 있다는 건 큰 힘이 돼요. 그 관계가 오래 이어지면 좋겠어요.
    - text: 친구와의 시간에서 긍정적인 에너지가 느껴져서 나도 기분이 좋아져요.
    - text: 웃을 수 있는 친구가 있다는 건 정말 소중한 일이에요. 그 소중함, 잘 느끼고 있는 것 같아요. (+)
    - text: 친구와의 관계에서 좋은 변화가 보인다면, 그건 당신이 쌓아온 시간 덕분일 거예요.

  utter_friend_neutral:
    - text: 친구 관계가 애매할 땐, 거리를 두고 지켜보는 것도 괜찮아요. (0)
    - text: 같이 있어도 그저 그런 느낌이 들 때가 있어요. 그 감정을 억지로 긍정적으로 만들 필요는 없어요.
    - text: 친구들과의 관계가 조금은 피곤하게 느껴질 수도 있어요. 그럴 땐 나를 먼저 돌보는 것도 중요해요.
    - text: 친한 것 같으면서도 미묘한 거리감이 느껴질 수 있어요. 그 애매함도 자연스러운 관계의 한 모습이에요.
    - text: 요즘 친구들이랑 관계가 딱 잘 모르겠는 느낌일 수 있겠네요. 그런 상태를 인지하는 것만으로도 의미 있어요. (0)

  utter_friend_negative:
    - text: 외롭고 허전한 마음… 너무나 이해돼요. 말해줘서 고마워요. (-)
    - text: 사람은 많은데 진짜 내 편은 없는 것 같을 때, 정말 서글프죠.
    - text: 친구 관계에서 상처를 받으면 오래 가요. 그 아픔을 혼자만 꾹 참고 있지 않았으면 해요.
    - text: 주변에 있어도 혼자인 느낌, 많이 외로웠을 것 같아요.
    - text: 연락할 사람을 떠올리기 힘들 때 정말 공허하죠. 그 마음을 여기서라도 나눠줘서 고마워요. (-)

  ## 전문가 상담 권유 ------------------------------
  utter_recommend_counseling:
    - text: 당신의 상태가 많이 힘들어 보여요. 혼자 끌어안지 말고 전문가에게 상담받아보는 건 어때요?
    - text: 가끔은 전문가의 상담을 받아보는 것도 좋을 거 같아요.
    - text: 지금처럼 힘든 시간이 길어진다면, 혼자 버티기보다 전문적인 도움을 받아보는 것도 큰 힘이 될 수 있어요.
    - text: 가까운 상담 센터나 정신건강 전문가와 이야기해보는 것도 한 가지 선택지가 될 수 있어요.
    - text: ‘도움을 요청한다’는 건 약함이 아니라 용기예요. 필요하다면 상담을 고려해봐도 괜찮아요.

  ## 대화 연장 여부 묻기 ------------------------------
  utter_ask_continue:
    - text: 혹시 더 얘기하고 싶은 게 있나요?
    - text: 혹시 더 털어놓고 싶은 이야기가 있나요?
    - text: 조금 더 이야기 나누고 싶다면 편하게 말해줘도 돼요. 계속 얘기할까요?
    - text: 여기서 마무리해도 좋고, 더 이야기해도 좋아요. 당신 마음은 어때요?
    - text: 아직 말하지 못한 마음이 남아 있다면, 지금 꺼내줘도 괜찮아요.

  utter_continue_prompt:
    - text: 어떤 일이 더 있었나요?
    - text: 좋아요. 우리 더 얘기해봐요. 또 무슨 일이 있었나요?
    - text: 이어서 얘기해볼까요? 마음에 남는 장면이 있다면 들려주세요.
    - text: 괜찮다면, 조금 더 구체적으로 이야기해줄 수 있을까요?
    - text: 계속 들어줄게요. 그다음엔 어떤 일이 있었나요?

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
